<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Manipulation</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <form name="form">
        <label for="username">Name</label><br/>
        <input type="text" name="username" value="" placeholder="Enter your name"><br/>
        <div id="name"></div><br/>
        <label for="email">Email</label><br/>
        <input type="text" name="email" value="" placeholder="Enter your email"><br/>
        <div id="email"></div><br/>
        <label for="pass">Password</label><br/>
        <input type="text" name="pass" value="" placeholder="Enter your password"><br/>
        <div id="pass"></div><br/>
        <button type="submit">Submit</button>
    </form>
    <script src="form.js"></script>
</body>
</html>
