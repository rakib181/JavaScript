<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container d-flex justify-content-center mt-5">
       <div class="calc border rounded-3 bg-dark">
         <div class="res text fs-1"></div>
         <div class="row m-2 mt-5">
            <div class="col-3">
                <button onclick="cls()" class="btn bg-white p-2 sz" id="cls" type="button">AC</button>
            </div>
            <div class="col-3">
                <button onclick="del()" class="btn bg-white p-2 sz" id="del" type="button">DEL</button>
            </div>
            <div class="col-3">
                <button onclick="inp('.')" class="btn bg-white p-2 sz" type="button">.</button>
            </div>
            <div class="col-3">
                <button onclick="inp('/')" class="btn bg-white p-2 sz" type="button">/</button>
            </div>
         </div>
         <div class="row m-2 d-flex justify-content-evenly">
            <div class="col-3">
                <button onclick="inp(1)" class="btn bg-white p-2 sz" type="button">1</button>
            </div>
            <div class="col-3">
                <button onclick="inp(2)" class="btn bg-white p-2 sz" type="button">2</button>
            </div>
            <div class="col-3">
                <button onclick="inp(3)" class="btn bg-white p-2 sz" type="button">3</button>
            </div>
            <div class="col-3">
                <button onclick="inp('x')" class="btn bg-white p-2 sz" type="button">X</button>
            </div>
         </div>
         <div class="row m-2 d-flex justify-content-evenly">
            <div class="col-3">
                <button onclick="inp(4)" class="btn bg-white p-2 sz" type="button">4</button>
            </div>
            <div class="col-3">
                <button onclick="inp(5)" class="btn bg-white p-2 sz" type="button">5</button>
            </div>
            <div class="col-3">
                <button onclick="inp(6)" class="btn bg-white p-2 sz" type="button">6</button>
            </div>
            <div class="col-3">
                <button onclick="inp('-')" class="btn bg-white p-2 sz" type="button">-</button>
            </div>
         </div>
         <div class="row m-2 d-flex justify-content-evenly">
            <div class="col-3">
                <button onclick="inp(7)" class="btn bg-white p-2 sz" type="button">7</button>
            </div>
            <div class="col-3">
                <button onclick="inp(8)" class="btn bg-white p-2 sz" type="button">8</button>
            </div>
            <div class="col-3">
                <button onclick="inp(9)" class="btn bg-white p-2 sz" type="button">9</button>
            </div>
            <div class="col-3">
                <button onclick="inp('+')" class="btn bg-white p-2 sz" type="button">+</button>
            </div>
         </div>
         <div class="d-flex justify-content-evenly">
            <button onclick="inp(0)" class="btn bg-white p-2 sz" type="button">0</button>
            <button onclick="inp('00')"" class="btn bg-white p-2 szdz" type="button">00</button>
            <button onclick="sol()" class="btn bg-warning p-2 szeq" type="button">=</button>
         </div>
      </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> -->
    <script src="script.js"></script>
</body>
</html>
